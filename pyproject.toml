[project]
name = "morphly"
version = "0.1.1"
description = "Typed workflows over a shared set of pydantic business objects"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Lucas Pereira", email = "lucaspereira0497@gmail.com" }]
keywords = ["workflow", "pydantic", "orchestration", "typed", "pipeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.13.4",
]

[project.urls]
Homepage = "https://github.com/lucarammel/morphly"
Repository = "https://github.com/lucarammel/morphly"
Issues = "https://github.com/lucarammel/morphly/issues"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.9",
    "ty>=0.0.66",
]
docs = [
    "mkdocstrings[python]>=0.27",
    "zensical>=0.0.53",
]

[build-system]
requires = ["uv_build>=0.7.19,<0.8"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://pypi.org/simple/"

[tool.uv.build-backend]
module-name = "morphly"
module-root = ""

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
