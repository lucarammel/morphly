[project]
name = "morph"
version = "0.1.0"
description = "Typed pipelines over a shared set of pydantic business objects"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Lucas Pereira", email = "lucaspereira0497@gmail.com" }]
keywords = ["pipeline", "pydantic", "orchestration", "typed", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.13.4"]

[project.urls]
Homepage = "https://github.com/lucarammel/morph"
Repository = "https://github.com/lucarammel/morph"
Issues = "https://github.com/lucarammel/morph/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "ty>=0.0.66",
]
docs = [
    "zensical>=0.0.53",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[[tool.uv.index]]
url = "https://pypi.org/simple/"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
