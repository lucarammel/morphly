[project]
name = "morph"
version = "0.1.0"
description = "Typed pipelines over a shared set of pydantic business objects"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = ["pydantic>=2.9"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.9",
    "ty>=0.0.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[[tool.uv.index]]
url = "https://pypi.org/simple/"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
