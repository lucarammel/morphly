name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check morph tests
      - run: uv run ruff format --check morph tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ty check

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest --cov=morph --cov-report=term-missing
      - name: Generate coverage badge
        run: |
          COV=$(uv run coverage report --format=total)
          if [ "$COV" -ge 90 ]; then COLOR=brightgreen
          elif [ "$COV" -ge 75 ]; then COLOR=yellow
          else COLOR=red
          fi
          curl -s "https://img.shields.io/badge/coverage-${COV}%25-${COLOR}" -o coverage.svg
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update coverage badge"
          file_pattern: coverage.svg
