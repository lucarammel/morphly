name: Feature request
description: Proposer une évolution
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problème
      description: Quel problème concret cette évolution résout-elle ?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposition
      description: À quoi ça pourrait ressembler (API, comportement) ?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées
      description: Solutions de contournement déjà essayées, s'il y en a.
